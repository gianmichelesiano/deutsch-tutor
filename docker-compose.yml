name: deutsch-tutor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deutsch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deutsch}
      POSTGRES_DB: ${POSTGRES_DB:-deutsch_tutor}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deutsch} -d ${POSTGRES_DB:-deutsch_tutor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deutsch}:${POSTGRES_PASSWORD:-deutsch}@db:5432/${POSTGRES_DB:-deutsch_tutor}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-https://api.deepseek.com}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-flash}
      LOCAL_LLM_THINKING_DISABLED: ${LOCAL_LLM_THINKING_DISABLED:-true}
      LOCAL_LLM_REPEAT_PENALTY: ${LOCAL_LLM_REPEAT_PENALTY:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-auto}
      USER_NAME: ${USER_NAME:-Gianmichele}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8118}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3100}:3000"

volumes:
  db_data:
