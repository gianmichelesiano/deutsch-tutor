# Overlay di sviluppo: monta il codice sorgente nel container api e attiva il reload.
# Caricato automaticamente da `docker compose` quando presente nella root.
services:
  api:
    volumes:
      - ./api/app:/app/app
      - ./api/prompts:/app/prompts
      - ./api/tests:/app/tests
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/pyproject.toml:/app/pyproject.toml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build:
      context: ./web
      target: deps
    command: sh -c "npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  web_node_modules:
  web_next:
